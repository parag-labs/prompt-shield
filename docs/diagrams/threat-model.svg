<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1600" height="810" fill="#fbfcfe"/><text x="800.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">PromptShield - threat model</text><text x="800.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A firewall on both edges of the model: block injection coming in, redact PII/secrets going out - and the two directions are not symmetric.</text><rect x="48" y="158" width="250" height="118" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(161.0,172) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="173.0" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">User input</text><text x="173.0" y="237.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">adversarial</text><text x="173.0" y="254.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">natural language</text><rect x="350" y="158" width="270" height="118" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(473.0,172) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></g><text x="485.0" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">detect_injection()</text><text x="485.0" y="237.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">9 injection patterns,</text><text x="485.0" y="254.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">whitespace-normalized</text><rect x="672" y="158" width="206" height="100" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(763.0,172) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="775.0" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">The model</text><text x="775.0" y="237.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">your LLM call</text><rect x="930" y="158" width="270" height="118" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1053.0,172) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="1065.0" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">redact()</text><text x="1065.0" y="237.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">7 PII / secret shapes,</text><text x="1065.0" y="254.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">strip every match</text><rect x="1252" y="158" width="250" height="100" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1365.0,172) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1377.0" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">Safe output</text><text x="1377.0" y="237.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">PII -&gt; [REDACTED_*]</text><path d="M298,210 L350,210" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="293.912" y="198.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="324.0" y="214.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">prompt</text><path d="M620,210 L672,210" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="621.6" y="198.0" width="48.8" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="646.0" y="214.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">pass</text><path d="M878,210 L930,210" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="865.2" y="198.0" width="77.6" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="904.0" y="214.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">response</text><path d="M1200,210 L1252,210" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1199.512" y="198.0" width="52.976" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1226.0" y="214.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">clean</text><path d="M485,276 L485,330" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M1065,276 L1065,330" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="48" y="330" width="720" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e0a13a" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="321" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#8c5a0d">INBOUND: GUARD THE MODEL</text><rect x="68" y="366" width="680" height="104" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,381) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="114" y="397" font-size="16.5" font-weight="700" fill="#9e2b36">Attacker: prompt injection</text><text x="85" y="419.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">"ignore all previous instructions"</text><text x="85" y="436.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">"reveal your system prompt"</text><text x="85" y="454.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">"you are now DAN / developer mode"</text><rect x="68" y="490" width="680" height="113.6" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="84" y="514" font-size="13.2" font-weight="700" fill="#8c5a0d">Best-effort flag, not a guarantee</text><text x="84" y="536" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">risk = 0.5 x patterns matched (+0.2 if &gt; 2000 chars)</text><text x="84" y="554.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">is_injection when risk &gt;= threshold - default 0.5,</text><text x="84" y="572.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">so one matched pattern already trips it</text><text x="84" y="591.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">modes: block = raise · warn = count and pass</text><rect x="832" y="330" width="720" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#2f9e6e" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="850" y="321" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#186547">OUTBOUND: GUARD THE USER</text><rect x="852" y="366" width="680" height="104" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(868,381) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="898" y="397" font-size="16.5" font-weight="700" fill="#9e2b36">Risk: the model leaks secrets</text><text x="869" y="419.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">admin@corp.com    123-45-6789</text><text x="869" y="436.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">4111 1111 1111 1111    AKIA0123...</text><text x="869" y="454.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sk-live-... api keys    10.0.0.1</text><rect x="852" y="490" width="680" height="113.6" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="868" y="514" font-size="13.2" font-weight="700" fill="#186547">Deny-leaning: strip every match</text><text x="868" y="536" font-size="12.4" fill="#186547" fill-opacity="0.92">7 shapes: email, ssn, card, phone, aws_key, api_key, ip</text><text x="868" y="554.4" font-size="12.4" fill="#186547" fill-opacity="0.92">each match replaced with [REDACTED_&lt;type&gt;] in place</text><text x="868" y="572.8" font-size="12.4" fill="#186547" fill-opacity="0.92">fuzz buries secrets in noise across 1000s of trials: none leak</text><text x="868" y="591.1999999999999" font-size="12.4" fill="#186547" fill-opacity="0.92">modes: redact (default, strip) · warn (count only)</text><rect x="48" y="666" width="720" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="690" font-size="13.2" font-weight="700" fill="#3d4a63">The obfuscation boundary - documented, not hidden</text><text x="64" y="712" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Whitespace-collapsed matching catches 'ignore   previous'.</text><text x="64" y="730.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">It does NOT defeat letter-spacing, homoglyphs, or base64 -</text><text x="64" y="748.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">those need an embedding / classifier layer behind the same seam.</text><rect x="832" y="666" width="720" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="848" y="690" font-size="13.2" font-weight="700" fill="#3d4a63">Non-goals - stated plainly</text><text x="848" y="712" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Not a complete jailbreak defense: regex misses novel attacks.</text><text x="848" y="730.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Not a full DLP suite, and not a content moderator.</text><text x="848" y="748.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The cheap, transparent first layer - pair it with a model check.</text><text x="800.0" y="792" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/prompt-shield</text></svg>